name: Sophia regression verification
on:
  push:
    branches: [main, repair/system-reliability]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_SERVICE_KEY: test-service-key
      ANTHROPIC_API_KEY: test-anthropic-key
      DEEPGRAM_API_KEY: test-deepgram-key
      SIGNALWIRE_SIGNING_KEY: test-signing-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-regression-results
          path: test-results.xml
